<style>
        body {
            background-color: #f9f9fc;
            font-family: 'Inter', sans-serif;
        }

        .neo-raised {
            box-shadow: 6px 6px 12px rgba(0,0,0,0.1), -6px -6px 12px rgba(255,255,255,0.8);
        }

        .neo-sunken {
            box-shadow: inset 4px 4px 8px rgba(0,0,0,0.1), inset -4px -4px 8px rgba(255,255,255,0.8);
        }

        .neo-dial-track {
            box-shadow: inset 10px 10px 20px rgba(0,0,0,0.05), inset -10px -10px 20px rgba(255,255,255,0.9);
        }

        .neo-dial-handle {
            box-shadow: 8px 8px 16px rgba(0,0,0,0.12), -8px -8px 16px rgba(255,255,255,0.9);
        }

        .active-gradient {
            background: linear-gradient(135deg, #632ce5 0%, #7c4dff 100%);
            box-shadow: 0 0 15px rgba(99, 44, 229, 0.4);
        }

        .dial-rotation {
            transform: rotate(var(--rotation, 0deg));
            transition: transform 0.1s linear;
        }
        
        .toggle-active {
            box-shadow: 0 0 10px rgba(99, 44, 229, 0.3), inset 2px 2px 4px rgba(0,0,0,0.1);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .fill-icon {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="min-h-screen text-on-surface">
<!-- Top App Bar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile py-sm bg-background shadow-[6px_6px_12px_rgba(0,0,0,0.1),-6px_-6px_12px_rgba(255,255,255,0.8)]">
<div class="flex items-center gap-md">
<button class="w-10 h-10 flex items-center justify-center neo-raised rounded-full active:scale-95 duration-100 hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">NexaHome</h1>
</div>
<div class="w-10 h-10 rounded-full neo-raised overflow-hidden border-2 border-surface-container">
<img class="w-full h-full object-cover" data-alt="A professional studio portrait of a modern tech-savvy individual with friendly expression, high-key soft lighting, minimalist background, centered composition, high-end commercial photography style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCFIk-p2hlT-4y562XVTAev5Da05P9dysxTLzWT8KVVBG9PfNYPU9p8VOm31xtxogTUlZtCR2aRhEmJLX_9wcIBrEoqjGsIUH9EHAUMyK5C4Q__Z4PGxTNqLOPD_Vy8qtYNDavQg0LIUFmUXJskg9GT1iIMraNXQFPaFKm6pyLRO_WY1EjcJpCajIGmDWHfr7E5d05ClO2bMOia9eA00dVus9O9IKBchhkZNikTA-bc-iKofD1M2yrMKpvGKiHW3-mQFw7B1xPv0yM"/>
</div>
</header>
<main class="pt-32 pb-32 px-margin-mobile max-w-lg mx-auto">
<!-- Room Heading -->
<div class="mb-lg">
<p class="font-label-md text-label-md text-on-surface-variant">Living Room</p>
<h2 class="font-headline-lg text-headline-lg text-on-surface">Climate Control</h2>
</div>
<!-- Temperature Dial Section -->
<section class="flex flex-col items-center justify-center py-xl">
<div class="relative w-72 h-72 flex items-center justify-center rounded-full neo-dial-track bg-background">
<!-- Dial Outer Ring/Track -->
<svg class="absolute inset-0 w-full h-full -rotate-90 p-4">
<circle cx="50%" cy="50%" fill="none" r="45%" stroke="#eeeef0" stroke-width="8"></circle>
<circle cx="50%" cy="50%" fill="none" id="progress-ring" r="45%" stroke="url(#primaryGradient)" stroke-dasharray="283" stroke-dashoffset="140" stroke-linecap="round" stroke-width="8"></circle>
<defs>
<lineargradient id="primaryGradient" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" style="stop-color:#632ce5;stop-opacity:1"></stop>
<stop offset="100%" style="stop-color:#7c4dff;stop-opacity:1"></stop>
</lineargradient>
</defs>
</svg>
<!-- Inner Dial -->
<div class="w-56 h-56 rounded-full neo-dial-handle bg-background flex flex-col items-center justify-center relative z-10 transition-transform active:scale-95">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-xs">Current</span>
<div class="flex items-start">
<span class="font-display text-display text-on-surface leading-none" id="temp-value">22</span>
<span class="font-headline-md text-headline-md text-primary mt-1">°C</span>
</div>
<div class="mt-md flex gap-base">

<span class="font-label-sm text-label-sm text-on-surface-variant">Cooling Active</span>
</div>
</div>

<span class="material-symbols-outlined text-on-surface-variant">remove</span>
</button>

<span class="material-symbols-outlined text-on-surface-variant">add</span>
</button>
</div>
</section>
<!-- Mode Selection -->
<section class="mt-xl">
<h3 class="font-label-md text-label-md text-on-surface-variant mb-md">Operation Mode</h3>
<div class="grid grid-cols-3 gap-md neo-sunken p-2 rounded-xl">
<button class="flex flex-col items-center justify-center py-md rounded-lg active-gradient text-on-primary">
<span class="material-symbols-outlined mb-xs">ac_unit</span>
<span class="font-label-sm text-label-sm">Cool</span>
</button>
<button class="flex flex-col items-center justify-center py-md rounded-lg text-on-surface-variant hover:bg-surface-variant/20 transition-colors">
<span class="material-symbols-outlined mb-xs">sunny</span>
<span class="font-label-sm text-label-sm">Heat</span>
</button>
<button class="flex flex-col items-center justify-center py-md rounded-lg text-on-surface-variant hover:bg-surface-variant/20 transition-colors">
<span class="material-symbols-outlined mb-xs">autorenew</span>

</button>
</div>
</section>

<section class="mt-xl grid grid-cols-2 gap-lg">
<div>

<div class="flex flex-col gap-sm">
<div class="neo-sunken p-1 rounded-xl flex">

</div>
</div>
</div>
<div>
<h3 class="font-label-md text-label-md text-on-surface-variant mb-md">Efficiency</h3>
<div class="flex items-center justify-between px-md py-base neo-raised rounded-xl bg-background">
<span class="font-label-md text-label-md text-on-surface">Eco Mode</span>
<button class="w-12 h-6 rounded-full neo-sunken relative transition-all duration-300" id="eco-toggle">
<div class="absolute left-1 top-1 w-4 h-4 rounded-full neo-raised bg-background transition-all duration-300 transform translate-x-6 bg-primary" id="eco-thumb"></div>
</button>
</div>
</div>
</section>
<!-- Usage Insight Card (Asymmetric Layout element) -->
<section class="mt-xl">
<div class="neo-raised rounded-2xl p-lg bg-background flex items-center gap-lg">
<div class="w-16 h-16 neo-sunken rounded-xl flex items-center justify-center text-primary">
<span class="material-symbols-outlined fill-icon" style="font-size: 32px;">energy_savings_leaf</span>
</div>

<h4 class="font-headline-md text-headline-md text-on-surface">Efficiency Rank</h4>

</div>
</div>

</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-xs py-sm bg-background rounded-t-xl shadow-[0px_-6px_12px_rgba(0,0,0,0.05)]">
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:text-primary transition-colors">
<span class="material-symbols-outlined">home</span>
<span class="font-label-sm text-label-sm">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:text-primary transition-colors">
<span class="material-symbols-outlined">grid_view</span>
<span class="font-label-sm text-label-sm">Rooms</span>
</button>
<button class="flex flex-col items-center justify-center text-primary shadow-[inset_4px_4px_8px_rgba(0,0,0,0.1),inset_-4px_-4px_8px_rgba(255,255,255,0.8)] rounded-xl p-2">
<span class="material-symbols-outlined fill-icon">devices</span>
<span class="font-label-sm text-label-sm">Devices</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:text-primary transition-colors">
<span class="material-symbols-outlined">bolt</span>
<span class="font-label-sm text-label-sm">Auto</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:text-primary transition-colors">
<span class="material-symbols-outlined">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</button>
</nav>
<script>
        // Simple Interaction logic
        const ecoToggle = document.getElementById('eco-toggle');
        const ecoThumb = document.getElementById('eco-thumb');
        let ecoActive = true;

        ecoToggle.addEventListener('click', () => {
            ecoActive = !ecoActive;
            if (ecoActive) {
                ecoThumb.style.transform = 'translateX(24px)';
                ecoThumb.classList.add('bg-primary');
                ecoToggle.classList.add('toggle-active');
            } else {
                ecoThumb.style.transform = 'translateX(0px)';
                ecoThumb.classList.remove('bg-primary');
                ecoToggle.classList.remove('toggle-active');
            }
        });

        // Dial temperature simulation
        const tempValue = document.getElementById('temp-value');
        const progressRing = document.getElementById('progress-ring');
        let currentTemp = 22;

        document.querySelectorAll('button').forEach(btn => {
            if (btn.querySelector('.material-symbols-outlined')?.textContent === 'add') {
                btn.addEventListener('click', () => {
                    if (currentTemp < 30) {
                        currentTemp++;
                        tempValue.textContent = currentTemp;
                        updateRing();
                    }
                });
            }
            if (btn.querySelector('.material-symbols-outlined')?.textContent === 'remove') {
                btn.addEventListener('click', () => {
                    if (currentTemp > 16) {
                        currentTemp--;
                        tempValue.textContent = currentTemp;
                        updateRing();
                    }
                });
            }
        });

        function updateRing() {
            // Mapping 16-30 to 283-0 dashoffset
            const min = 16;
            const max = 30;
            const percentage = (currentTemp - min) / (max - min);
            const offset = 283 - (283 * percentage);
            progressRing.style.strokeDashoffset = offset;
        }

        // Initialize ring
        updateRing();
    </script>
</body></html>
