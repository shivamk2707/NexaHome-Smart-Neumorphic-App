<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9f9fc;
            overflow-x: hidden;
        }
        
        .neo-raised {
            box-shadow: 6px 6px 12px rgba(0,0,0,0.1), -6px -6px 12px rgba(255,255,255,0.8);
        }
        
        .neo-sunken {
            box-shadow: inset 4px 4px 8px rgba(0,0,0,0.1), inset -4px -4px 8px rgba(255,255,255,0.8);
        }

        .neo-glow-success {
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.2), 6px 6px 12px rgba(0,0,0,0.1), -6px -6px 12px rgba(255,255,255,0.8);
        }

        .check-animation {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: dash 0.8s cubic-bezier(0.65, 0, 0.45, 1) forwards 0.5s;
        }

        @keyframes dash {
            from { stroke-dashoffset: 100; }
            to { stroke-dashoffset: 0; }
        }

        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #632ce5;
            opacity: 0;
        }
    </style>

                      "surface-tint": "#6833ea",

                      "outline-variant": "#cac3d8",
                      "outline": "#7a7487",

                      "secondary": "#0058bd",

                      "error": "#ba1a1a",
                      "on-secondary-fixed": "#001a42",
                      "on-error-container": "#93000a",
                      "secondary-fixed-dim": "#adc6ff",

<body class="flex flex-col min-h-screen text-on-background">
<!-- Top App Bar (Shell Navigation Suppressed for Success Screen per Rule, but using header for identity) -->

<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary font-extrabold tracking-tight">NexaHome</h1>
<div class="w-10 h-10 rounded-full neo-raised flex items-center justify-center overflow-hidden">

</div>
</header>
<main class="flex-grow flex items-center justify-center px-margin-mobile pt-24 pb-12 relative overflow-hidden">
<!-- Background Ambient Animation -->

<div class="max-w-md w-full flex flex-col items-center text-center z-10">
<!-- Large Neomorphic Glowing Checkmark Container -->
<div class="relative w-48 h-48 mb-10">
<!-- Outer Ring -->
<div class="absolute inset-0 rounded-full neo-raised bg-background"></div>
<!-- Inner Well -->
<div class="absolute inset-4 rounded-full neo-sunken bg-background flex items-center justify-center">
<!-- The Glowing Success Circle -->
<div class="w-24 h-24 rounded-full bg-background neo-glow-success flex items-center justify-center relative overflow-hidden">
<div class="absolute inset-0 bg-green-500 opacity-5"></div>
<svg class="w-16 h-16 text-green-500" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewbox="0 0 24 24">
<path class="check-animation" d="M20 6L9 17L4 12"></path>

</div>
</div>
<!-- Orbiting Micro-detail (Floating) -->
<div class="absolute -top-2 -right-2 w-12 h-12 rounded-full neo-raised bg-background flex items-center justify-center animate-bounce duration-[3000ms]">
<span class="material-symbols-outlined text-primary text-xl" data-icon="bolt">bolt</span>
</div>
</div>
<!-- Text Content -->
<div class="space-y-4 mb-12">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile font-extrabold text-on-background">Connection Successful!</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">
                    Your <span class="font-bold text-primary">Smart Hub Pro</span> is now synced and ready to control your ecosystem.
                </p>
</div>
<!-- Device Summary Card (Sunken Slot) -->
<div class="w-full neo-sunken rounded-xl p-md flex items-center gap-md mb-12 bg-background/50">
<div class="w-14 h-14 rounded-lg neo-raised bg-background flex items-center justify-center">
<span class="material-symbols-outlined text-primary-container" data-icon="router">router</span>
</div>
<div class="text-left">
<div class="font-label-md text-label-md text-on-background">Living Room Hub</div>
<div class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1">
<span class="w-2 h-2 rounded-full bg-green-500"></span>
                        Signal Strength: Excellent
                    </div>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full space-y-gutter">
<button class="w-full py-md px-lg rounded-xl neo-raised bg-primary text-white font-label-md text-label-md hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-sm shadow-[0_8px_16px_rgba(99,44,229,0.3)]" onclick="handleDashboardClick()">
                    Go to Dashboard
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<button class="w-full py-md px-lg rounded-xl neo-raised bg-background text-primary font-label-md text-label-md hover:opacity-80 active:scale-95 transition-all">
                    Add Another Device
                </button>
</div>
</div>
</main>
<!-- Footer Identity (Non-navigational) -->
<footer class="py-md text-center">
<p class="font-label-sm text-label-sm text-outline-variant">NexaHome Ecosystem • Secure Connection</p>
</footer>
<div class="fixed inset-0 pointer-events-none z-0" id="confetti-container"></div>
<script>
        // Micro-interaction: Confetti Burst on Load
        function createConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#632ce5', '#7c4dff', '#22c55e', '#0058bd'];
            
            for (let i = 0; i < 40; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti rounded-full';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '100vh';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = (Math.random() * 6 + 4) + 'px';
                confetti.style.height = confetti.style.width;
                
                container.appendChild(confetti);
                
                const duration = Math.random() * 2 + 3;
                const delay = Math.random() * 0.5;
                
                confetti.animate([
                    { transform: `translateY(0) translateX(0) rotate(0deg)`, opacity: 1 },
                    { transform: `translateY(-120vh) translateX(${(Math.random() - 0.5) * 200}px) rotate(${Math.random() * 360}deg)`, opacity: 0 }
                ], {
                    duration: duration * 1000,
                    delay: delay * 1000,
                    easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
                }).onfinish = () => confetti.remove();
            }
        }

        window.onload = createConfetti;

        function handleDashboardClick() {
            // Visual feedback on the button
            const btn = event.currentTarget;
            btn.style.transform = 'scale(0.95)';
            setTimeout(() => {
                btn.style.transform = '';
            }, 100);
        }
    </script>
