<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const addButton = document.querySelector('button.neomorph-button');
            
            addButton.addEventListener('mouseenter', () => {
                addButton.classList.add('primary-glow');
            });
            
            addButton.addEventListener('mouseleave', () => {
                addButton.classList.remove('primary-glow');
            });

            // Optional subtle parallax on icon
            const houseIcon = document.querySelector('.icon-large').parentElement;
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth / 2 - e.pageX) / 40;
                const y = (window.innerHeight / 2 - e.pageY) / 40;
                houseIcon.style.transform = `translate(${x}px, ${y}px)`;
            });
        });
    </script>
