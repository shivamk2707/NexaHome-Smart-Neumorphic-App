<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NexaHome - Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .neumorphic-raised {
            box-shadow: 6px 6px 12px rgba(0,0,0,0.1), -6px -6px 12px rgba(255,255,255,0.8);
        }
        .neumorphic-sunken {
            box-shadow: inset 4px 4px 8px rgba(0,0,0,0.1), inset -4px -4px 8px rgba(255,255,255,0.8);
        }
        .neumorphic-btn-active:active {
            box-shadow: inset 4px 4px 8px rgba(0,0,0,0.2), inset -4px -4px 8px rgba(255,255,255,0.7);
            transform: scale(0.98);
        }
        .primary-glow {
            box-shadow: 0 0 20px rgba(99, 44, 229, 0.3);
        }
        @keyframes pulse-soft {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }
        .animate-pulse-soft {
            animation: pulse-soft 3s infinite ease-in-out;
        }
        .floating-device {
            animation: float 6s infinite ease-in-out;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary": "#565a5c",
                    "primary-container": "#7c4dff",
                    "secondary-fixed-dim": "#adc6ff",
                    "on-primary-fixed": "#20005f",
                    "surface-container": "#eeeef0",
                    "surface-container-high": "#e8e8ea",
                    "surface-container-lowest": "#ffffff",
                    "inverse-on-surface": "#f0f0f3",
                    "surface-bright": "#f9f9fc",
                    "primary": "#632ce5",
                    "primary-fixed": "#e8deff",
                    "on-primary": "#ffffff",
                    "surface-tint": "#6833ea",
                    "secondary-container": "#1e70e4",
                    "on-tertiary-fixed": "#191c1e",
                    "outline": "#7a7487",
                    "on-secondary": "#ffffff",
                    "on-secondary-container": "#fefcff",
                    "tertiary-fixed": "#e0e3e6",
                    "on-background": "#1a1c1e",
                    "on-surface-variant": "#494455",
                    "error-container": "#ffdad6",
                    "secondary": "#0058bd",
                    "outline-variant": "#cac3d8",
                    "on-error-container": "#93000a",
                    "surface-container-low": "#f3f3f6",
                    "on-primary-container": "#fcf6ff",
                    "on-error": "#ffffff",
                    "on-surface": "#1a1c1e",
                    "surface-dim": "#dadadc",
                    "tertiary-container": "#6f7275",
                    "error": "#ba1a1a",
                    "on-secondary-fixed-variant": "#004495",
                    "surface": "#f9f9fc",
                    "on-secondary-fixed": "#001a42",
                    "tertiary-fixed-dim": "#c4c7ca",
                    "on-tertiary": "#ffffff",
                    "on-primary-fixed-variant": "#4f00d0",
                    "inverse-surface": "#2f3133",
                    "primary-fixed-dim": "#cdbdff",
                    "secondary-fixed": "#d8e2ff",
                    "background": "#f9f9fc",
                    "surface-variant": "#e2e2e5",
                    "surface-container-highest": "#e2e2e5",
                    "on-tertiary-container": "#f6f8fb",
                    "inverse-primary": "#cdbdff",
                    "on-tertiary-fixed-variant": "#44474a"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "sm": "8px",
                    "margin-mobile": "20px",
                    "gutter": "16px",
                    "margin-desktop": "40px",
                    "xl": "32px",
                    "xs": "4px",
                    "base": "8px",
                    "lg": "24px",
                    "md": "16px"
            },
            "fontFamily": {
                    "label-sm": ["Inter"],
                    "body-lg": ["Inter"],
                    "body-md": ["Inter"],
                    "label-md": ["Inter"],
                    "display": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "headline-lg": ["Inter"],
                    "headline-md": ["Inter"]
            },
            "fontSize": {
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "26px", "fontWeight": "400"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                    "display": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "500"}]
            }
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden">
<!-- Top Navigation Placeholder (Back Button only for Onboarding) -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center px-margin-mobile py-lg">
<button class="w-12 h-12 flex items-center justify-center neumorphic-raised rounded-xl text-on-surface-variant hover:opacity-80 transition-all active:scale-90 neumorphic-btn-active">
<span class="material-symbols-outlined">arrow_back</span>
</button>
</header>
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile pt-32 pb-margin-mobile">
<!-- Connection Illustration Section -->
<div class="relative w-full max-w-sm aspect-square flex items-center justify-center mb-12">
<!-- Central Hub -->
<div class="relative z-10 w-32 h-32 neumorphic-raised rounded-full flex items-center justify-center bg-background border-4 border-primary/10">
<div class="w-24 h-24 neumorphic-sunken rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-4xl animate-pulse-soft" style="font-variation-settings: 'FILL' 1;">router</span>
</div>
<!-- Scanning Ring -->
<div class="absolute inset-[-10px] rounded-full border-2 border-dashed border-primary/20 animate-[spin_10s_linear_infinite]"></div>
</div>
<!-- Orbiting Devices -->
<!-- Lamp -->
<div class="absolute top-0 left-1/4 floating-device" style="animation-delay: 0s;">
<div class="w-16 h-16 neumorphic-raised rounded-2xl flex items-center justify-center bg-background">
<span class="material-symbols-outlined text-tertiary">lightbulb</span>
<!-- Connection Line (Visualized through shadow gradient or tiny dots) -->
<div class="absolute bottom-[-20px] left-1/2 w-1 h-1 bg-primary/30 rounded-full"></div>
</div>
</div>
<!-- Smart Lock -->
<div class="absolute bottom-10 right-4 floating-device" style="animation-delay: 1.5s;">
<div class="w-16 h-16 neumorphic-raised rounded-2xl flex items-center justify-center bg-background">
<span class="material-symbols-outlined text-tertiary">lock</span>
</div>
</div>
<!-- Air Conditioner -->
<div class="absolute top-1/3 -right-2 floating-device" style="animation-delay: 0.8s;">
<div class="w-16 h-16 neumorphic-raised rounded-2xl flex items-center justify-center bg-background">
<span class="material-symbols-outlined text-tertiary">ac_unit</span>
</div>
</div>
<!-- Smart Speaker -->
<div class="absolute bottom-0 left-8 floating-device" style="animation-delay: 2.2s;">
<div class="w-16 h-16 neumorphic-raised rounded-2xl flex items-center justify-center bg-background">
<span class="material-symbols-outlined text-tertiary">speaker</span>
</div>
</div>
<!-- Connection Icons with Glow -->
<div class="absolute top-1/4 right-1/4 w-10 h-10 neumorphic-raised rounded-full flex items-center justify-center bg-background primary-glow">
<span class="material-symbols-outlined text-primary text-sm">wifi</span>
</div>
<div class="absolute bottom-1/4 left-1/4 w-10 h-10 neumorphic-raised rounded-full flex items-center justify-center bg-background primary-glow">
<span class="material-symbols-outlined text-primary text-sm">bluetooth</span>
</div>
<!-- Connecting Waves (Animated Borders) -->
<div class="absolute w-64 h-64 border border-primary/5 rounded-full animate-pulse"></div>
<div class="absolute w-80 h-80 border border-primary/5 rounded-full animate-pulse" style="animation-delay: 1s;"></div>
</div>
<!-- Text Content -->
<div class="text-center space-y-md max-w-xs">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface font-extrabold tracking-tight">
                Seamless Connection
            </h1>
<p class="font-body-md text-on-surface-variant leading-relaxed">
                Add and manage all your smart devices in seconds with our auto-discovery technology.
            </p>
</div>
<!-- Progress Indicators -->
<div class="flex gap-2 mt-12 mb-8">
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="w-6 h-2 rounded-full bg-primary neumorphic-raised"></div>
</div>
</main>
<!-- Footer Action -->
<footer class="px-margin-mobile pb-xl flex flex-col gap-md">
<button class="w-full h-16 bg-primary text-on-primary font-label-md text-label-md rounded-2xl flex items-center justify-center gap-2 primary-glow shadow-lg transition-all active:scale-95 duration-200" id="continueBtn">
            Continue
            <span class="material-symbols-outlined text-lg">chevron_right</span>
</button>
<p class="text-center font-label-sm text-label-sm text-outline">
            Searching for nearby devices...
        </p>
</footer>
<!-- Background Decoration -->
<div class="fixed top-[-10%] right-[-10%] w-[50%] h-[40%] bg-primary/5 blur-[120px] rounded-full -z-10 pointer-events-none"></div>
<div class="fixed bottom-[-10%] left-[-10%] w-[50%] h-[40%] bg-secondary/5 blur-[120px] rounded-full -z-10 pointer-events-none"></div>
<script>
        // Simple micro-interaction for the central hub
        const hub = document.querySelector('.animate-pulse-soft');
        let scale = 1;
        let growing = true;

        setInterval(() => {
            if (growing) {
                scale += 0.005;
                if (scale >= 1.1) growing = false;
            } else {
                scale -= 0.005;
                if (scale <= 1) growing = true;
            }
            hub.style.transform = `scale(${scale})`;
        }, 50);

        // Click interaction for devices
        document.querySelectorAll('.floating-device > div').forEach(card => {
            card.addEventListener('click', () => {
                card.classList.remove('neumorphic-raised');
                card.classList.add('neumorphic-sunken');
                setTimeout(() => {
                    card.classList.add('neumorphic-raised');
                    card.classList.remove('neumorphic-sunken');
                }, 300);
            });
        });

        // Continue button interaction
        document.getElementById('continueBtn').addEventListener('click', function() {
            this.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Connecting...';
            setTimeout(() => {
                this.innerHTML = 'Connected <span class="material-symbols-outlined">check_circle</span>';
                this.classList.remove('bg-primary');
                this.classList.add('bg-on-secondary-fixed-variant');
            }, 1500);
        });
    </script>
</body></html>
