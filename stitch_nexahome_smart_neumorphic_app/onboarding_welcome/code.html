<style>
        body {
            background-color: #f9f9fc;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        /* Neomorphic Raised State */
        .neo-raised {
            box-shadow: 6px 6px 12px rgba(0, 0, 0, 0.1), 
                        -6px -6px 12px rgba(255, 255, 255, 0.8);
        }

        /* Neomorphic Sunken State */
        .neo-sunken {
            box-shadow: inset 4px 4px 8px rgba(0, 0, 0, 0.08), 
                        inset -4px -4px 8px rgba(255, 255, 255, 0.8);
        }

        /* Hero Image Container Shadow */
        .hero-shadow {
            box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.05), 
                        -10px -10px 20px rgba(255, 255, 255, 0.9);
        }

        /* Primary Action Button Hover/Active */
        .btn-primary-active:active {
            transform: scale(0.96);
            box-shadow: inset 4px 4px 8px rgba(0, 0, 0, 0.2);
            transition: all 0.1s ease;
        }

        /* Animation for dots */
        .dot-active {
            width: 24px;
            background-color: #632ce5;
            transition: all 0.3s ease;
        }
        
        .floating-element {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
<style>

<span class="mr-2">Get Started</span>

</button>

<!-- Background Decorative Elements -->
<div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/5 blur-[120px] rounded-full -z-10"></div>
<div class="fixed bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-secondary-container/5 blur-[120px] rounded-full -z-10"></div>
<script>
        // Simple micro-interaction for the button
        function handleGetStarted() {
            const btn = event.currentTarget;
            btn.classList.remove('neo-raised');
            btn.classList.add('neo-sunken');
            
            // Revert after a short delay to simulate tap
            setTimeout(() => {
                btn.classList.remove('neo-sunken');
                btn.classList.add('neo-raised');
                console.log('Navigating to next onboarding step...');
            }, 150);
        }

        // Parallax effect on mouse move (Desktop Only)
        document.addEventListener('mousemove', (e) => {
            if (window.innerWidth > 768) {
                const moveX = (e.clientX - window.innerWidth / 2) / 50;
                const moveY = (e.clientY - window.innerHeight / 2) / 50;
                const hero = document.querySelector('.floating-element');
                if (hero) {
                    hero.style.transform = `translate(${moveX}px, ${moveY}px)`;
                }
            }
        });
    </script>
