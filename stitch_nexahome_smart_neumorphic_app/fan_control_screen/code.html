<script>
        function setSpeed(value, btnIndex) {
            // Update text
            document.getElementById('speed-value').innerText = value;
            
            // Update circular progress
            const circle = document.getElementById('progress-circle');
            const radius = 100;
            const circumference = 2 * Math.PI * radius;
            const offset = circumference - (value / 100) * circumference;
            circle.style.strokeDashoffset = offset;
            
            // Update button styles
            const buttons = document.querySelectorAll('.speed-btn');
            buttons.forEach((btn, idx) => {
                if (idx === btnIndex) {
                    btn.classList.add('active-glow', 'border-2', 'border-primary/20');
                    btn.classList.remove('neomorph-raised');
                } else {
                    btn.classList.remove('active-glow', 'border-2', 'border-primary/20');
                    btn.classList.add('neomorph-raised');
                }
            });
        }

        // Initialize progress bar position
        window.onload = () => {
            setSpeed(50, 1);
        };
    </script>
