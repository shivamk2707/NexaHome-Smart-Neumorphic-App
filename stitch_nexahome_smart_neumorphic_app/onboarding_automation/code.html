<style>
        .neomorph-raised {
            box-shadow: 6px 6px 12px rgba(0, 0, 0, 0.1), -6px -6px 12px rgba(255, 255, 255, 0.8);
        }
        .neomorph-sunken {
            box-shadow: inset 4px 4px 8px rgba(0, 0, 0, 0.08), inset -4px -4px 8px rgba(255, 255, 255, 0.8);
        }
        .neomorph-pressed {
            transform: scale(0.96);
            box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.1), inset -2px -2px 5px rgba(255, 255, 255, 0.8);
            transition: all 0.1s ease-in-out;
        }
        .gradient-glow {
            background: linear-gradient(135deg, #632ce5 0%, #7c4dff 100%);
            box-shadow: 0 10px 20px -5px rgba(99, 44, 229, 0.4);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .orbit-container {
            position: relative;
            width: 280px;
            height: 280px;
        }
        .orbit-item {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: center center;
        }
        @keyframes rotate-ccw {
            from { transform: translate(-50%, -50%) rotate(0deg) translateX(110px) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(-360deg) translateX(110px) rotate(360deg); }
        }
        .animate-orbit {
            animation: rotate-ccw 20s linear infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-surface font-body-md overflow-x-hidden min-h-screen flex flex-col items-center justify-center p-margin-mobile">
<!-- Top Navigation (Logo only for onboarding) -->

<div class="absolute bottom-[20%] right-[10%] w-80 h-80 bg-secondary/5 rounded-full blur-[120px]"></div>
</div>
<script>
        // Micro-interaction for the Finish button
        document.querySelector('button').addEventListener('touchstart', function() {
            this.classList.add('neomorph-pressed');
        });
        document.querySelector('button').addEventListener('touchend', function() {
            this.classList.remove('neomorph-pressed');
        });

        // Simulating the dynamic update of the AI card countdown (visual only)
        let seconds = 300;
        const statusText = document.querySelector('.neomorph-sunken p');
        
        setInterval(() => {
            if (seconds > 0) {
                seconds--;
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                // We keep the prompt requirement "Turning off lights in 5 mins." mostly static for brand integrity
                // but we could pulse the indicator
            }
        }, 1000);
    </script>
