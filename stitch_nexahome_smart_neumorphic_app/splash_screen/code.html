<style>
        body {
            background-color: #f9f9fc;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        /* Neomorphic Depth States */
        .neo-raised {
            background: #f9f9fc;
            box-shadow: 6px 6px 12px rgba(0, 0, 0, 0.1), 
                        -6px -6px 12px rgba(255, 255, 255, 0.8);
        }

        .neo-sunken {
            background: #f9f9fc;
            box-shadow: inset 4px 4px 8px rgba(0, 0, 0, 0.1), 
                        inset -4px -4px 8px rgba(255, 255, 255, 0.8);
        }

        /* Subtle atmospheric pulse for the background */
        @keyframes atmospheric-pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }

        .glow-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(99, 44, 229, 0.15) 0%, transparent 70%);
            animation: atmospheric-pulse 8s ease-in-out infinite;
            z-index: 0;
        }

        /* Animated icon float */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .float-icon {
            animation: float 3s ease-in-out infinite;
        }

        /* Progress Bar Animation */
        @keyframes progress-fill {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        .progress-bar-inner {
            animation: progress-fill 3s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }

        /* Initial Fade In */
        .fade-entrance {
            animation: fadeIn 1.2s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col items-center justify-center min-h-screen relative">
<!-- Atmospheric Glow Background -->
<div class="glow-overlay"></div>
<!-- Main Content Container (No Shell for Splash as per mandate) -->
<main class="relative z-10 flex flex-col items-center justify-center fade-entrance">
<!-- Animated House Icon Container -->
<div class="neo-raised rounded-full w-24 h-24 flex items-center justify-center mb-10 float-icon">
<span class="material-symbols-outlined text-primary text-[48px]" data-icon="house" style="font-variation-settings: 'FILL' 1;">
                house
            </span>
</div>
<!-- Logo & Branding Section -->
<div class="flex flex-col items-center">
<!-- Branded Logo Text -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight font-extrabold mb-2 drop-shadow-sm">
                NexaHome
            </h1>
<!-- Neomorphic Logo Sub-Container -->
<div class="neo-sunken px-6 py-2 rounded-full mb-12">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-[0.2em]">
                    Intelligence
                </span>
</div>
</div>
</main>
<!-- Bottom Loading Section -->
<div class="fixed bottom-16 w-full max-w-[240px] px-margin-mobile flex flex-col items-center z-10">
<!-- Progress Track -->
<div class="neo-sunken w-full h-1.5 rounded-full overflow-hidden mb-4">
<!-- Progress Fill -->
<div class="progress-bar-inner h-full bg-primary shadow-[0_0_12px_rgba(99,44,229,0.4)] rounded-full"></div>
</div>
<!-- App Info -->
<div class="flex flex-col items-center gap-1">
<p class="font-label-sm text-label-sm text-on-surface-variant/60">Starting control systems...</p>
<p class="font-label-sm text-label-sm text-on-surface-variant/40 mt-8">v1.0.4</p>
</div>
</div>
<!-- Decoration Background Elements -->
<div class="absolute top-0 left-0 w-full h-full pointer-events-none overflow-hidden">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute -bottom-[10%] -right-[10%] w-[50%] h-[50%] rounded-full bg-secondary/5 blur-[120px]"></div>
</div>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Subtle rotation movement based on slight mouse/gyro movement could be added here
            const container = document.querySelector('main');
            
            window.addEventListener('mousemove', (e) => {
                const moveX = (e.clientX - window.innerWidth / 2) / 100;
                const moveY = (e.clientY - window.innerHeight / 2) / 100;
                container.style.transform = `translate(${moveX}px, ${moveY}px)`;
            });

            // Simulate transition after loading
            setTimeout(() => {
                // In a real app, this would redirect to the Home screen
                console.log("Loading complete. System ready.");
            }, 3200);
        });
    </script>
</body></html>
