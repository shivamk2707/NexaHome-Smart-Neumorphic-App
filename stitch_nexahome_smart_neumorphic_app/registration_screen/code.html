<style>
        body {
            background-color: #f9f9fc;
            font-family: 'Inter', sans-serif;
        }
        /* Neomorphic Raised */
        .neo-raised {
            box-shadow: 6px 6px 12px rgba(0,0,0,0.1), -6px -6px 12px rgba(255,255,255,0.8);
        }
        /* Neomorphic Sunken (Pressed) */
        .neo-sunken {
            box-shadow: inset 4px 4px 8px rgba(0,0,0,0.1), inset -4px -4px 8px rgba(255,255,255,0.8);
        }
        /* Primary Button Glow */
        .neo-primary-btn {
            background: linear-gradient(145deg, #632ce5, #7c4dff);
            box-shadow: 4px 4px 10px rgba(99, 44, 229, 0.4), -4px -4px 10px rgba(255, 255, 255, 0.8);
        }
        .neo-primary-btn:active {
            box-shadow: inset 4px 4px 8px rgba(0,0,0,0.2);
            transform: scale(0.98);
        }
        /* Custom Toggle/Checkbox Well */
        .neo-checkbox-well {
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.1), inset -2px -2px 5px rgba(255,255,255,0.8);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="min-h-screen flex flex-col items-center justify-center p-margin-mobile">
<!-- Brand Header -->
<header class="w-full max-w-md mb-xl flex flex-col items-center">
<div class="w-16 h-16 rounded-2xl neo-raised flex items-center justify-center mb-md bg-background">
<span class="material-symbols-outlined text-primary text-headline-lg" data-icon="bolt">bolt</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight">Create Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-xs">Join NexaHome to start managing your smart space.</p>
</header>
<!-- Main Registration Form -->
<main class="w-full max-w-md">
<form class="space-y-lg" onsubmit="event.preventDefault();">
<!-- Name Field -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface ml-xs">Full Name</label>
<div class="neo-sunken rounded-xl bg-background flex items-center px-md py-sm">
<span class="material-symbols-outlined text-outline mr-sm" data-icon="person">person</span>
<input class="bg-transparent border-none focus:ring-0 w-full font-body-md text-on-surface placeholder:text-outline-variant" placeholder="John Doe" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface ml-xs">Email Address</label>
<div class="neo-sunken rounded-xl bg-background flex items-center px-md py-sm">
<span class="material-symbols-outlined text-outline mr-sm" data-icon="mail">mail</span>
<input class="bg-transparent border-none focus:ring-0 w-full font-body-md text-on-surface placeholder:text-outline-variant" placeholder="john@example.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface ml-xs">Password</label>
<div class="neo-sunken rounded-xl bg-background flex items-center px-md py-sm">
<span class="material-symbols-outlined text-outline mr-sm" data-icon="lock">lock</span>
<input class="bg-transparent border-none focus:ring-0 w-full font-body-md text-on-surface placeholder:text-outline-variant" placeholder="••••••••" type="password"/>
<span class="material-symbols-outlined text-outline cursor-pointer hover:text-primary transition-colors" data-icon="visibility">visibility</span>
</div>
</div>
<!-- Confirm Password Field -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface ml-xs">Confirm Password</label>
<div class="neo-sunken rounded-xl bg-background flex items-center px-md py-sm">
<span class="material-symbols-outlined text-outline mr-sm" data-icon="lock_reset">lock_reset</span>
<input class="bg-transparent border-none focus:ring-0 w-full font-body-md text-on-surface placeholder:text-outline-variant" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Home Location Field -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface ml-xs">Home Location</label>
<div class="neo-sunken rounded-xl bg-background flex items-center px-md py-sm">
<span class="material-symbols-outlined text-outline mr-sm" data-icon="location_on">location_on</span>
<input class="bg-transparent border-none focus:ring-0 w-full font-body-md text-on-surface placeholder:text-outline-variant" placeholder="San Francisco, CA" type="text"/>
</div>
</div>
<!-- Terms and Conditions -->
<div class="flex items-start space-x-md pt-sm">
<div class="relative flex items-center">
<input class="peer appearance-none w-6 h-6 rounded-lg neo-checkbox-well bg-background border-none checked:bg-primary transition-all duration-200 cursor-pointer" id="terms" type="checkbox"/>
<span class="material-symbols-outlined absolute text-white opacity-0 peer-checked:opacity-100 pointer-events-none text-sm left-1" data-icon="check">check</span>
</div>
<label class="font-label-md text-label-md text-on-surface-variant cursor-pointer select-none" for="terms">
                    I agree to the <span class="text-primary font-semibold">Terms of Service</span> and <span class="text-primary font-semibold">Privacy Policy</span>.
                </label>
</div>
<!-- Primary Action Button -->
<button class="w-full py-md rounded-xl neo-primary-btn text-on-primary font-headline-md text-headline-md transition-all duration-200 mt-xl" type="submit">
                Create Account
            </button>
<!-- Login Link -->
<div class="pt-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Already have an account? 
                    <a class="text-primary font-bold hover:underline transition-all" href="#">Log In</a>
</p>
</div>
</form>
</main>
<!-- Visual Element: Abstract Background Graphic -->
<div class="fixed top-[-10%] right-[-10%] w-[40%] h-[40%] opacity-10 pointer-events-none">
<div class="w-full h-full bg-contain bg-no-repeat" data-alt="A sophisticated digital artwork featuring floating neomorphic geometric spheres and soft glowing purple light trails on a clean white background. High-tech smart home aesthetic, minimalist and premium feel with soft shadows and organic shapes. The lighting is ethereal and atmospheric, consistent with light-mode modern UI design." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBjxvNycOvHykOySgg0agvr-qETzp1pvtO_5mAndJ1fXS0qknPWdzU82GbqOLFVEFWNMUi_N83LQxbbr_ycpkcg4sXiGV3K4l4Cia8tQFrTpx65QqBXdT7Z_eHsQ1WmvDH8RY7Q8Ft88Ctm-CZGKhSeCVVoAogaT6-GmNKsIpXZBSssYRdnGRyV1ofcqcGhkgR2JAwyTySNnhylqqyPq2mw_D1qPMn3LYrqVRcFuy6WgwLVC4oT4ptpkB4yG_Wh2BJXs6lgPvlh7TU')"></div>
</div>
<!-- Micro-interaction Script -->
<script>
        // Simple input focus effects
        const inputs = document.querySelectorAll('.neo-sunken input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('ring-2', 'ring-primary/20');
                input.parentElement.style.transition = 'all 0.3s ease';
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('ring-2', 'ring-primary/20');
            });
        });

        // Password visibility toggle
        const visibilityBtn = document.querySelector('[data-icon="visibility"]');
        if(visibilityBtn) {
            visibilityBtn.addEventListener('click', () => {
                const passInput = visibilityBtn.previousElementSibling;
                if(passInput.type === 'password') {
                    passInput.type = 'text';
                    visibilityBtn.innerText = 'visibility_off';
                } else {
                    passInput.type = 'password';
                    visibilityBtn.innerText = 'visibility';
                }
            });
        }
    </script>
</body></html>
