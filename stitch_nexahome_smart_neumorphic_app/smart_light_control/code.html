<script>
        // Simple Interaction logic for brightness dial
        const brightnessContainer = document.getElementById('brightness-container');
        const brightnessValueDisplay = document.getElementById('brightness-value');
        const progressCircle = document.getElementById('progress-circle');
        const knobDot = document.getElementById('knob-dot');

        let isDragging = false;

        function updateBrightness(e) {
            const rect = brightnessContainer.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - centerX;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - centerY;
            
            let angle = Math.atan2(y, x) * (180 / Math.PI);
            angle += 90; // Adjust for SVG starting position
            if (angle < 0) angle += 360;

            const percentage = Math.round((angle / 360) * 100);
            
            // Update UI
            brightnessValueDisplay.textContent = percentage + '%';
            
            // Update Circular Dashoffset
            // Circumference = 2 * PI * 44 = 276.46
            const offset = 276.46 - (276.46 * (percentage / 100));
            progressCircle.style.strokeDashoffset = offset;

            // Update Knob Position
            knobDot.style.transform = `rotate(${angle}deg) translateY(-112px)`;
            
            // Set CSS Variable for possible conic effects
            brightnessContainer.style.setProperty('--value', percentage);
        }

        brightnessContainer.addEventListener('mousedown', (e) => {
            isDragging = true;
            updateBrightness(e);
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) updateBrightness(e);
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Touch support
        brightnessContainer.addEventListener('touchstart', (e) => {
            isDragging = true;
            updateBrightness(e);
            e.preventDefault();
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (isDragging) {
                updateBrightness(e);
                e.preventDefault();
            }
        }, { passive: false });

        window.addEventListener('touchend', () => {
            isDragging = false;
        });
    </script>
