<button class="h-16 rounded-2xl flex items-center justify-center neo-raised bg-background text-primary neo-button-active" onclick="popDigit()">
<span class="material-symbols-outlined text-2xl">backspace</span>

<script>
        let currentOtp = "";
        const otpSpans = document.querySelectorAll('.otp-digit');
        const timerElement = document.getElementById('timer');

        function appendDigit(digit) {
            if (currentOtp.length < 6) {
                currentOtp += digit;
                updateDisplay();
            }
        }

        function popDigit() {
            if (currentOtp.length > 0) {
                currentOtp = currentOtp.slice(0, -1);
                updateDisplay();
            }
        }

        function updateDisplay() {
            otpSpans.forEach((span, index) => {
                span.textContent = currentOtp[index] || "";
                
                // Highlight the "active" box
                const container = span.parentElement;
                if (index === currentOtp.length) {
                    container.classList.remove('neo-sunken');
                    container.classList.add('neo-raised', 'ring-2', 'ring-primary/20');
                } else if (currentOtp[index]) {
                    container.classList.remove('neo-raised', 'ring-2', 'ring-primary/20');
                    container.classList.add('neo-sunken');
                } else {
                    container.classList.remove('neo-raised', 'ring-2', 'ring-primary/20');
                    container.classList.add('neo-sunken');
                }
            });
        }

        // Simple Timer Logic
        let seconds = 119; // 01:59
        const countdown = setInterval(() => {
            let minutes = Math.floor(seconds / 60);
            let remSeconds = seconds % 60;
            timerElement.textContent = `${minutes.toString().padStart(2, '0')}:${remSeconds.toString().padStart(2, '0')}`;
            if (seconds <= 0) clearInterval(countdown);
            seconds--;
        }, 1000);

        // Initial visual state
        updateDisplay();
    </script>
