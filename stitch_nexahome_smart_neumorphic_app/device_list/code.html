<style>
        body {

        /* Neomorphic Raised */
        .neo-raised {
            box-shadow: 6px 6px 12px rgba(0,0,0,0.1), 
                        -6px -6px 12px rgba(255,255,255,0.8);
        }

        /* Neomorphic Sunken */
        .neo-sunken {

                        inset -4px -4px 8px rgba(255,255,255,0.8);
        }

        /* Active Glow State for Primary Buttons */
        .neo-active {
            background: linear-gradient(145deg, #632ce5, #7c4dff);

<script>
        function toggleDevice(btn) {
            const card = btn.closest('.device-card');
            const statusText = card.querySelector('.status-text');
            const iconContainer = card.querySelector('.neo-sunken');
            
            if (btn.classList.contains('neo-active')) {
                // Turn OFF
                btn.classList.remove('neo-active');
                btn.classList.add('neo-raised');
                statusText.innerText = 'Currently OFF';
                iconContainer.classList.add('text-outline');
                iconContainer.classList.remove('text-primary');
            } else {
                // Turn ON
                btn.classList.remove('neo-raised');
                btn.classList.add('neo-active');
                statusText.innerText = 'Currently ON';
                iconContainer.classList.add('text-primary');
                iconContainer.classList.remove('text-outline');
            }
            
            // Haptic feedback simulation
            btn.style.transform = 'scale(0.9)';
            setTimeout(() => btn.style.transform = 'scale(1)', 100);
        }

        function switchTab(btn, category) {
            // Update UI for buttons
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('neo-sunken', 'bg-primary', 'text-on-primary');
                b.classList.add('neo-raised', 'text-on-surface-variant');
            });
            btn.classList.remove('neo-raised', 'text-on-surface-variant');
            btn.classList.add('neo-sunken', 'bg-primary', 'text-on-primary');

            // Update Title
            document.getElementById('active-category-title').innerText = btn.innerText.trim();

            // Mock Category Content Update (Visual Only)
            const deviceIcons = {
                'lights': ['lamp', 'light', 'wb_iridescent', 'ceiling_light'],
                'climate': ['thermostat', 'air', 'ac_unit', 'heat_pump'],
                'security': ['shield', 'videocam', 'lock', 'sensor_window'],
                'appliances': ['kitchen', 'oven_gen', 'coffee_maker', 'local_laundry_service']
            };
            
            const titles = {
                'lights': ['Living Room', 'Hallway', 'Kitchen Spot', 'Bedroom'],
                'climate': ['Nest Main', 'Bedroom AC', 'Bathroom Heat', 'Office Air'],
                'security': ['Front Gate', 'Driveway Cam', 'Main Lock', 'Patio Sensor'],
                'appliances': ['Smart Fridge', 'Wall Oven', 'Espresso Max', 'Washing Machine']
            };

            const container = document.getElementById('device-container');
            const cards = container.querySelectorAll('.device-card');
            
            cards.forEach((card, index) => {
                const icon = card.querySelector('.material-symbols-outlined');
                const title = card.querySelector('h3');
                
                // Add a simple fade out-in transition
                card.style.opacity = '0';
                card.style.transform = 'translateY(10px)';
                
                setTimeout(() => {
                    icon.innerText = deviceIcons[category][index];
                    title.innerText = titles[category][index];
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, 150);
            });
        }
    </script>
