<style>
        body {
            background-color: #f9f9fc;
            color: #1a1c1e;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* Neomorphic Raised */
        .neo-raised {
            background: #f9f9fc;
            box-shadow: 6px 6px 12px rgba(0, 0, 0, 0.1),
                       -6px -6px 12px rgba(255, 255, 255, 0.8);
        }

        /* Neomorphic Sunken (Pressed) */
        .neo-sunken {
            background: #f9f9fc;
            box-shadow: inset 4px 4px 8px rgba(0, 0, 0, 0.08),
                        inset -4px -4px 8px rgba(255, 255, 255, 0.9);
        }

        /* Primary Button Style */
        .btn-primary-neo {
            background: linear-gradient(145deg, #632ce5, #7c4dff);
            box-shadow: 4px 4px 10px rgba(99, 44, 229, 0.3),
                       -4px -4px 10px rgba(255, 255, 255, 0.8);
            transition: all 0.2s ease;
        }
        .btn-primary-neo:active {
            transform: scale(0.97);
            box-shadow: inset 4px 4px 8px rgba(0, 0, 0, 0.2);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }

        /* Ambient Background Blur */
        .ambient-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 44, 229, 0.08) 0%, rgba(255, 255, 255, 0) 70%);
            filter: blur(40px);
            z-index: -1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col justify-center items-center px-margin-mobile py-xl relative">
<!-- Ambient Decor -->
<div class="ambient-glow top-[-50px] right-[-50px]"></div>
<div class="ambient-glow bottom-[-50px] left-[-50px]"></div>
<!-- Login Container -->
<div class="w-full max-w-[400px] flex flex-col items-center">
<!-- Brand Identity -->
<div class="mb-xl flex flex-col items-center">
<div class="w-16 h-16 neo-raised rounded-2xl flex items-center justify-center mb-md">
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">bolt</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight font-extrabold">NexaHome</h1>
</div>
<!-- Welcome Heading -->
<div class="w-full mb-xl">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-xs">Welcome Back</h2>
<p class="font-body-md text-on-surface-variant">Sign in to control your smart world.</p>
</div>
<!-- Form Section -->
<form class="w-full space-y-lg">
<!-- Email Field -->
<div class="flex flex-col space-y-sm">
<label class="font-label-md text-on-surface ml-1">Email Address</label>
<div class="neo-sunken rounded-xl px-md py-4 flex items-center">
<span class="material-symbols-outlined text-outline mr-md">mail</span>
<input class="bg-transparent border-none outline-none focus:ring-0 w-full font-body-md text-on-surface placeholder:text-outline-variant" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col space-y-sm">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-on-surface">Password</label>
<a class="font-label-sm text-primary hover:opacity-80 transition-opacity" href="#">Forgot password?</a>
</div>
<div class="neo-sunken rounded-xl px-md py-4 flex items-center">
<span class="material-symbols-outlined text-outline mr-md">lock</span>
<input class="bg-transparent border-none outline-none focus:ring-0 w-full font-body-md text-on-surface placeholder:text-outline-variant" placeholder="••••••••" type="password"/>
<button class="text-outline hover:text-primary" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Login Button -->
<button class="btn-primary-neo w-full py-4 rounded-xl text-on-primary font-headline-md shadow-lg" type="submit">
                Login
            </button>
</form>
<!-- Divider Section -->
<div class="w-full flex items-center my-xl">
<div class="flex-1 h-[1px] bg-outline-variant/30"></div>
<span class="px-md font-label-sm text-on-surface-variant uppercase tracking-widest">Or login with</span>
<div class="flex-1 h-[1px] bg-outline-variant/30"></div>
</div>
<!-- Social Login -->
<div class="w-full">
<button class="neo-raised w-full py-4 rounded-xl flex items-center justify-center space-x-md hover:scale-[1.01] active:scale-95 transition-all duration-200 group">
<div class="w-6 h-6 flex items-center justify-center">
<svg height="20" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-1 .67-2.28 1.07-3.71 1.07-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.67-.35-1.39-.35-2.09s.13-1.42.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
</div>
<span class="font-label-md text-on-surface group-hover:text-primary transition-colors">Continue with Google</span>
</button>
</div>
<!-- Footer Links -->
<div class="mt-xl text-center">
<p class="font-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="text-primary font-label-md hover:underline decoration-primary/30 underline-offset-4" href="#">Register</a>
</p>
</div>
</div>
<!-- Decorative Bottom Card (Peek-a-boo style) -->
<div class="fixed bottom-0 left-0 w-full flex justify-center opacity-40 select-none pointer-events-none px-margin-mobile">
<div class="w-full max-w-[400px] h-4 neo-raised rounded-t-3xl"></div>
</div>
<script>
        // Subtle interaction for input fields - adding "active" feel on focus
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.style.boxShadow = "inset 6px 6px 10px rgba(0, 0, 0, 0.12), inset -6px -6px 10px rgba(255, 255, 255, 1)";
                input.parentElement.style.transition = "all 0.3s ease";
            });
            input.addEventListener('blur', () => {
                input.parentElement.style.boxShadow = "";
            });
        });

        // Form submission prevention for demo
        document.querySelector('form').addEventListener('submit', (e) => {
            e.preventDefault();
            console.log("Login sequence initiated...");
        });
    </script>
</body></html>
