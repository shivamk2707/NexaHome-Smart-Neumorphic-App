<script>
        function toggleLight() {
            const btn = document.getElementById('light-toggle-btn');
            const thumb = document.getElementById('toggle-thumb');
            const status = document.getElementById('light-status');
            
            const isOn = thumb.style.transform === 'translateX(0px)';
            
            if (isOn) {
                thumb.style.transform = 'translateX(calc(100% - 8px))';
                thumb.classList.add('bg-primary');
                thumb.classList.remove('bg-on-surface-variant');
                status.innerText = 'On';
            } else {
                thumb.style.transform = 'translateX(0px)';
                thumb.classList.remove('bg-primary');
                thumb.classList.add('bg-on-surface-variant');
                status.innerText = 'Off';
            }
        }

        function updateFan(val) {
            document.getElementById('fan-val').innerText = val + '%';
        }
    </script>
